apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web-label
  template:
    metadata: 
      labels:
        app: nginx-web-label
    spec:
      containers:
      - name: nginx-container
        image: minseung12/nginx:0875f9c617096d051af0409a94e48992d6a4fb6d
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nginx-web-label
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-base-ingress
  annotations:  # 보안 그룹 등 AWS에 대한 설정들
    # 보안 그룹 설정
    alb.ingress.kubernetes.io/security-groups: sg-08e3df0495caea1eb # , id, ...
    # internet-facing: 외부 로드밸런서(IP 부여), internet: 내부
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip: (Pod의 IP로 트래픽 전달)
    alb.ingress.kubernetes.io/target-type: ip # instance: EC2 인스턴스를 대상으로 하는 타겟 그룹 생성
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # HTTPS 인증서 정의
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ca-central-1:925047940866:certificate/3352eb5f-ad9a-440d-b66e-0e3528d6a2f6
    # HTTP 접속시 HTTPS로 리다이렉션(선택사항, 권장)
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # 경로 재설정
    # Nginx Ingress Controller 사용시: nginx.ingress.kubernetes.io/rewrite-target: /
    alb.ingress.kubernetes.io/transforms.nginx-svc: >
      [
        {
          "type": "url-rewrite",
          "urlRewriteConfig": {
            "rewrites": [
              {
                "regex": "^\\/nginx(?:\\/(.*))?$",
                "replace": "/$1"
              }
            ]
          }
        }
      ]
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-svc
            port:
              number: 80
