apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web-label
  template:
    metadata: 
      labels:
        app: nginx-web-label
    spec:
      containers:
      - name: nginx-container
        image: minseung12/nginx:73e7f5c91636ae0289139b2c03ab410cb9ce57bb
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: LoadBalancer
  selector:
    app: nginx-web-label
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
